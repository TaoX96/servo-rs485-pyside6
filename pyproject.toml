[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-rig-control"
version = "0.1.0"
description = "Simulation-first distributed control foundation for an A6-RS knee test rig"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "minimalmodbus>=2.1,<3",
  "pyserial>=3.5,<4",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires explicitly connected real hardware"]
addopts = "-m 'not hardware'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["knee_rig"]
